[tools]

# Go — pinned to the go.mod toolchain so golangci-lint (built against
# this Go minor) can type-check the module. "latest" drifted to 1.27
# and broke `just lint` with "file requires newer Go version".
go = "1.26.2"
golines = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"

# Repo utilities
just = "latest"

# Formatters and linters
markdownlint-cli2 = "0.18.1"
yamlfmt = "0.20.0"
yamllint = "1.37.1"
prettier = "3.7.4"
git-cliff = "latest"
actionlint = "latest"
"github:donaldgifford/forge" = "0.4.1"

# tools
yq = "4.48.1"
jq = "latest"
"github:donaldgifford/docz" = "latest"

# Release tools
golangci-lint = "2.11.4"
goreleaser = "latest"

# Smoke fixture (tests/smoke runs `terraform test`; CI pins the same)
terraform = "1.14.0"

# Security
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

# Compliance
"go:github.com/google/go-licenses" = "latest"
