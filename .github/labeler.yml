---
# PR auto-labeling (actions/labeler). Path globs tag what changed;
# head-branch patterns map the branch-prefix convention from CLAUDE.md
# (feat/, fix/, chore/, docs/, bug/) onto labels. `scripts/labels.sh`
# creates the label set itself.

go:
  - changed-files:
      - any-glob-to-any-file: "cmd/**"
      - any-glob-to-any-file: "internal/**"
      - any-glob-to-any-file: "pkg/**"
      - any-glob-to-any-file: "tests/contract/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file: "go.mod"
      - any-glob-to-any-file: "go.sum"
      - any-glob-to-any-file: "tests/contract/go.mod"
      - any-glob-to-any-file: "tests/contract/go.sum"
      - any-glob-to-any-file: "mise.toml"
      - any-glob-to-any-file: "renovate.json5"

documentation:
  - changed-files:
      - any-glob-to-any-file: "docs/**"
      - any-glob-to-any-file: "README.md"
      - any-glob-to-any-file: "CLAUDE.md"
      - any-glob-to-any-file: "mkdocs.yml"
      - any-glob-to-any-file: ".docz.yaml"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"
      - any-glob-to-any-file: "justfile"
      - any-glob-to-any-file: "docker.just"

repo:
  - changed-files:
      - any-glob-to-any-file: ".codecov.yml"
      - any-glob-to-any-file: ".golangci.yml"
      - any-glob-to-any-file: ".goreleaser.yml"
      - any-glob-to-any-file: ".markdownlint.yaml"
      - any-glob-to-any-file: ".prettierrc.yaml"
      - any-glob-to-any-file: ".yamlfmt.yml"
      - any-glob-to-any-file: ".yamllint.yml"
      - any-glob-to-any-file: "cliff.toml"
      - any-glob-to-any-file: "scripts/**"

docker:
  - changed-files:
      - any-glob-to-any-file: "Dockerfile"
      - any-glob-to-any-file: ".dockerignore"
      - any-glob-to-any-file: "docker-bake.hcl"
      - any-glob-to-any-file: "tests/smoke/**"

# Branch-prefix labels. Patterns are anchored so `feat/...` doesn't
# also match a `fix/...` branch that mentions "feature" in its name.
feature:
  - head-branch: ["^feat/", "^feature/"]
fix:
  - head-branch: ["^fix/"]
bug:
  - head-branch: ["^bug/"]
chore:
  - head-branch: ["^chore/"]
docs:
  - head-branch: ["^docs/"]
security:
  - head-branch: ["^security/"]
